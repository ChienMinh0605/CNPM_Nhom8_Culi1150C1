name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    name: Backend – unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Cấu hình
        run: cmake -S backend -B backend/build -DBUILD_SERVER=OFF -DBUILD_TESTS=ON
      - name: Biên dịch
        run: cmake --build backend/build -j"$(nproc)"
      - name: Chạy test
        run: ctest --test-dir backend/build --output-on-failure

  backend-image:
    name: Backend – build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build -t dcsv-backend ./backend

  frontend:
    name: Frontend – analyze và test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
