name: dcsv_frontend
description: Giao diện DCSV Digital CMS (cổng công khai, trang quản trị, soát vé).
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.11.0
  cupertino_ui: ^1.1.6
  go_router: ^14.0.0
  http: ^1.2.0
  intl: any
  url_launcher: ^6.3.3
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    # Be Vietnam Pro, giấy phép SIL OFL 1.1 (assets/fonts/OFL.txt).
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
